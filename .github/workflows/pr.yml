name: Images

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-versions:
    name: Check image versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # History to the merge base.
          fetch-depth: 0

      - name: Check image versions
        run: make check-versions BASE=origin/${{ github.base_ref }}

  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run hadolint
        run: make lint

  build:
    name: Build and selftest changed images
    needs: [check-versions, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed images
        id: changed
        run: |
          images=$(make -s changed BASE=origin/${{ github.base_ref }})
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.changed.outputs.images != ''
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.changed.outputs.images != ''
        uses: docker/setup-buildx-action@v4

      - name: Build and selftest images for all platforms
        if: steps.changed.outputs.images != ''
        run: make selftest IMAGE="${{ steps.changed.outputs.images }}"
