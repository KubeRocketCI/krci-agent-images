name: Release images

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release at a time; a running release is never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: Push new image versions
    runs-on: ubuntu-latest
    permissions:
      # Git tags and GitHub releases <image>/v<VERSION>.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Catches a direct push to main that changed an image without a VERSION bump.
      - name: Check image versions
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: make check-versions BASE=${{ github.event.before }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushes <registry>/<image>:<VERSION> for every image whose tag is not in the registry; skips the rest.
      - name: Push images
        run: make push ALL=1 RELEASE=1

      # Runs after a failed push too: releases the images that are published.
      - name: Create GitHub releases
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-notes
